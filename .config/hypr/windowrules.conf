# ==================
# WINDOW RULES
# ==================
windowrule = tile true, match:class ^(org\.wezfurlong\.wezterm)$
windowrule = rounding 12, match:class ^(org\.gnome\.)
windowrule = border_size 0, match:class ^(org\.gnome\.)
windowrule = tile true, match:class ^(gnome-control-center)$
windowrule = tile true, match:class ^(pavucontrol)$
windowrule = tile true, match:class ^(nm-connection-editor)$
windowrule = float true, match:class ^(gnome-calculator)$
windowrule = float true, match:class ^(galculator)$
windowrule = float true, match:class ^(blueman-manager)$
windowrule = float true, match:class ^(org\.gnome\.Nautilus)$
windowrule = float true, match:class ^(steam)$
windowrule = tile true, match:class steam, match:title Steam
windowrule = border_size 0, match:class ^(org\.wezfurlong\.wezterm)$
windowrule = border_size 0, match:class ^(Alacritty)$
windowrule = border_size 0, match:class ^(com\.mitchellh\.ghostty)$
windowrule = border_size 0, match:class kitty
windowrule = float true, match:class ^(kitty-dropterm)$
windowrule = float true, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule = border_size 0, match:class zen
windowrule = float true, size 600 338, match:class zen, match:title Picture-in-Picture
windowrule = float true, size 400 700, match:class zen, match:title ^(Extension:.*)$
windowrule = float true, match:class ^(zoom)$
windowrule = float true, match:class ^(xdg-desktop-portal-gtk)$
windowrule = float true, match:class ^(xdg-desktop-portal)$
layerrule = no_anim on, match:namespace quickshell
windowrule = float true, match:class org.quickshell

# ==================
# Opacity Rules
# ==================
windowrule = opacity 0.9 0.9, match:float false, match:focus false # Unfocused windows are slightly transparent - Keep this as the first opacity rule
windowrule = opacity 1.0 override 1.0 override, match:focus false, match:class zen
windowrule = opacity 1.0 override 1.0 override, match:focus false, match:class mpv
windowrule = opacity 1.0 override 1.0 override, match:focus false, match:class imv
windowrule = opacity 1.0 override 1.0 override, match:focus false, match:class Plex

# ==================
# Game Related
# ==================
windowrule = float true, match:class yad
windowrule = float true, match:title SteamTinkerLaunch-MainMenu
