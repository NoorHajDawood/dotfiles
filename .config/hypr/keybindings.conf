# ==================
# KEYBINDINGS
# ==================
$mod = SUPER

# === Application Launchers ===
bind = $mod, T, exec, kitty # Launch Kitty terminal
bind = $mod, M, exec, kitty rmpc # Launch RMPC music player client in Kitty
bind = $mod, B, exec, zen-browser # Launch Zen browser
bind = $mod, E, exec, kitty yazi # Launch Yazi file manager in Kitty
bind = $mod, S, exec, steam # Launch Steam
bind = $mod, slash, exec, list_keybinds # Show keybindings manual

# === DankMateriallShell Shortcuts ===
bind = $mod, space, exec, dms ipc call spotlight toggle # Toggle spotlight launcher
bind = $mod, comma, exec, dms ipc call settings toggle # Toggle settings
bind = $mod, N, exec, dms ipc call notifications toggle # Toggle notifications
bind = $mod SHIFT, N, exec, dms ipc call notepad toggle # Toggle notepad
bind = $mod SHIFT, B, exec, dms ipc call bar toggle name "Main Bar" # && hyprctl dispatch exec toggle_gaps_out bar # Toggle bar visibility and gaps
# bind = $mod, TAB, exec, dms ipc call hypr toggleOverview # Toggle Hyprland overview mode
bind = $mod, V, exec, dms ipc call clipboard toggle # Toggle clipboard history

# === Pypr === #
bind = $mod SHIFT, V, exec, pypr toggle volume
bind = $mod, RETURN, exec, pypr toggle term
bind = $mod, Y, exec, pypr attach

# === Security ===
bind = $mod ALT, L, exec, dms ipc call lock lock # Lock the screen
bind = $mod SHIFT, L, exec, dms ipc call powermenu toggle # Toggle power menu options
bind = $mod SHIFT, E, exit # Exit Hyprland session
bind = $mod SHIFT, R, exec, hyprctl dispatch exec dms kill && hyprctl dispatch exec dms run # Kill and restart DMS (in case it freezes)
bind = CTRL ALT, Delete, exec, dms ipc call processlist toggle # Toggle process list

# === Audio Controls ===
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 3 # Increase volume
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 3 # Decrease volume
bindl = , XF86AudioMute, exec, dms ipc call audio mute # Mute audio
bindl = , XF86AudioMicMute, exec, dms ipc call audio micmute # Mute microphone

# === Brightness Controls ===
bindel = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5 # Increase monitor brightness
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 # Decrease monitor brightness

# === Window Management ===
bind = $mod, Q, killactive # Kill active window
bind = $mod, F, fullscreen, 1 # Toggle fullscreen on
bind = $mod SHIFT, F, fullscreen, 0 # Toggle fullscreen off
bind = $mod SHIFT, T, togglefloating # Toggle floating mode
bind = $mod, W, togglegroup # Toggle window group

# === Focus Navigation ===
bind = $mod, left, movefocus, l # Focus left window
bind = $mod, down, movefocus, d # Focus down window
bind = $mod, up, movefocus, u # Focus up window
bind = $mod, right, movefocus, r # Focus right window
bind = $mod, H, changegroupactive, b # Focus back window in group (H)
bind = $mod, L, changegroupactive, f # Focus forward window in group (L)

# === Window Movement ===
bind = $mod SHIFT, left, movewindow, l # Move window left
bind = $mod SHIFT, down, movewindow, d # Move window down
bind = $mod SHIFT, up, movewindow, u # Move window up
bind = $mod SHIFT, right, movewindow, r # Move window right
bind = $mod SHIFT, H, movewindow, l # Move window left (H)
bind = $mod SHIFT, J, movewindow, d # Move window down (J)
bind = $mod SHIFT, K, movewindow, u # Move window up (K)
bind = $mod SHIFT, L, movewindow, r # Move window right (L)

# === Column Navigation ===
bind = $mod, Home, focuswindow, first # Focus first window in column
bind = $mod, End, focuswindow, last # Focus last window in column

# === Monitor Navigation ===
bind = $mod CTRL, left, focusmonitor, l # Focus left monitor
bind = $mod CTRL, right, focusmonitor, r # Focus right monitor
bind = $mod CTRL, H, focusmonitor, l # Focus left monitor (H)
bind = $mod CTRL, J, focusmonitor, d # Focus down monitor (J)
bind = $mod CTRL, K, focusmonitor, u # Focus up monitor (K)
bind = $mod CTRL, L, focusmonitor, r # Focus right monitor (L)

# === Move to Monitor ===
bind = $mod SHIFT CTRL, left, movewindow, mon:l # Move window to left monitor
bind = $mod SHIFT CTRL, down, movewindow, mon:d # Move window to down monitor
bind = $mod SHIFT CTRL, up, movewindow, mon:u # Move window to up monitor
bind = $mod SHIFT CTRL, right, movewindow, mon:r # Move window to right monitor
bind = $mod SHIFT CTRL, H, movewindow, mon:l # Move window to left monitor (H)
bind = $mod SHIFT CTRL, J, movewindow, mon:d # Move window to down monitor (J)
bind = $mod SHIFT CTRL, K, movewindow, mon:u # Move window to up monitor (K)
bind = $mod SHIFT CTRL, L, movewindow, mon:r # Move window to right monitor (L)

# === Workspace Navigation ===
bind = $mod, Page_Down, workspace, e+1 # Switch to next workspace
bind = $mod, Page_Up, workspace, e-1 # Switch to previous workspace
bind = $mod, U, workspace, e+1 # Switch to next workspace (U)
bind = $mod, I, workspace, e-1 # Switch to previous workspace (I)
bind = $mod CTRL, down, movetoworkspace, e+1 # Move window to next workspace
bind = $mod CTRL, up, movetoworkspace, e-1 # Move window to previous workspace
bind = $mod CTRL, U, movetoworkspace, e+1 # Move window to next workspace (U)
bind = $mod CTRL, I, movetoworkspace, e-1 # Move window to previous workspace (I)

# === Move Workspaces ===
bind = $mod SHIFT, Page_Down, movetoworkspace, e+1 # Move to next workspace
bind = $mod SHIFT, Page_Up, movetoworkspace, e-1 # Move to previous workspace
bind = $mod SHIFT, U, movetoworkspace, e+1 # Move to next workspace (U)
bind = $mod SHIFT, I, movetoworkspace, e-1 # Move to previous workspace (I)

# === Mouse Wheel Navigation ===
bind = $mod, mouse_down, workspace, e+1 # Switch workspace with mouse wheel down
bind = $mod, mouse_up, workspace, e-1 # Switch workspace with mouse wheel up
bind = $mod CTRL, mouse_down, movetoworkspace, e+1 # Move window to next workspace with mouse wheel down
bind = $mod CTRL, mouse_up, movetoworkspace, e-1 # Move window to previous workspace with mouse wheel up

# === Numbered Workspaces ===
### Workspace switching for main monitor
bind = $mod, 1, exec, hyprctl dispatch focusmonitor $mainMonitor; hyprctl dispatch workspace 6 # Switch to workspace 6 on main monitor
bind = $mod, 2, exec, hyprctl dispatch focusmonitor $mainMonitor; hyprctl dispatch workspace 7 # Switch to workspace 7 on main monitor
bind = $mod, 3, exec, hyprctl dispatch focusmonitor $mainMonitor; hyprctl dispatch workspace 8 # Switch to workspace 8 on main monitor
bind = $mod, 4, exec, hyprctl dispatch focusmonitor $mainMonitor; hyprctl dispatch workspace 9 # Switch to workspace 9 on main monitor
bind = $mod, 5, exec, hyprctl dispatch focusmonitor $mainMonitor; hyprctl dispatch workspace 10 # Switch to workspace 10 on main monitor

### Workspace switching for secondary monitor
bind = $mod ALT, 1, exec, hyprctl dispatch focusmonitor $secondMonitor; hyprctl dispatch workspace 1 # Switch to workspace 1 on second monitor
bind = $mod ALT, 2, exec, hyprctl dispatch focusmonitor $secondMonitor; hyprctl dispatch workspace 2 # Switch to workspace 2 on second monitor
bind = $mod ALT, 3, exec, hyprctl dispatch focusmonitor $secondMonitor; hyprctl dispatch workspace 3 # Switch to workspace 3 on second monitor
bind = $mod ALT, 4, exec, hyprctl dispatch focusmonitor $secondMonitor; hyprctl dispatch workspace 4 # Switch to workspace 4 on second monitor
bind = $mod ALT, 5, exec, hyprctl dispatch focusmonitor $secondMonitor; hyprctl dispatch workspace 5 # Switch to workspace 5 on second monitor

# === Move to Numbered Workspaces ===
### Move to numbered workspaces for main monitor
bind = $mod SHIFT, 1, movetoworkspace, 6 # Move window to workspace 6 on main monitor
bind = $mod SHIFT, 2, movetoworkspace, 7 # Move window to workspace 7 on main monitor
bind = $mod SHIFT, 3, movetoworkspace, 8 # Move window to workspace 8 on main monitor
bind = $mod SHIFT, 4, movetoworkspace, 9 # Move window to workspace 9 on main monitor
bind = $mod SHIFT, 5, movetoworkspace, 10 # Move window to workspace 10 on main monitor

### Move to numbered workspaces for secondary monitor
bind = $mod CTRL, 1, movetoworkspace, 1 # Move window to workspace 1 on second monitor
bind = $mod CTRL, 2, movetoworkspace, 2 # Move window to workspace 2 on second monitor
bind = $mod CTRL, 3, movetoworkspace, 3 # Move window to workspace 3 on second monitor
bind = $mod CTRL, 4, movetoworkspace, 4 # Move window to workspace 4 on second monitor
bind = $mod CTRL, 5, movetoworkspace, 5 # Move window to workspace 5 on second monitor

# === Column Management ===
bind = $mod, bracketleft, layoutmsg, preselect l # Preselect left column
bind = $mod, bracketright, layoutmsg, preselect r # Preselect right column

# === Sizing & Layout ===
bind = $mod, R, layoutmsg, togglesplit # Toggle split layout
bind = $mod CTRL, F, resizeactive, exact 100% # Resize window to 100%

# === Move/resize windows with mainMod + LMB/RMB and dragging ===
bindmd = $mod, mouse:272, Move window, movewindow # Move window with mouse drag
bindmd = $mod, mouse:273, Resize window, resizewindow # Resize window with mouse drag

# === Move/resize windows with mainMod + LMB/RMB and dragging ===
bindd = $mod, code:20, Expand window left, resizeactive, -100 0 # Expand window left
bindd = $mod, code:21, Shrink window left, resizeactive, 100 0 # Shrink window left

# === Manual Sizing ===
binde = $mod, minus, resizeactive, -10% 0 # Decrease window width
binde = $mod, equal, resizeactive, 10% 0 # Increase window width
binde = $mod SHIFT, minus, resizeactive, 0 -10% # Decrease window height
binde = $mod SHIFT, equal, resizeactive, 0 10% # Increase window height

# === Screenshots ===
bind = $mod SHIFT, S, exec, grimblast copy area # Screenshot area to clipboard
bind = $mod CTRL, S, exec, grimblast save screen # Screenshot screen to clipboard
bind = ALT, XF86Launch1, exec, grimblast copy active # Screenshot active window to clipboard
bind = , Print, exec, grimblast copy area # Screenshot area to clipboard
bind = CTRL, Print, exec, grimblast copy screen # Screenshot screen to clipboard
bind = ALT, Print, exec, grimblast copy active # Screenshot active window to clipboard

# === System Controls ===
# bind = $mod SHIFT, P, dpms, off # Turn off display power management
bind = $mod SHIFT, W, exec, hyprctl dispatch exec next_shuffled_wallpaper # Next shuffled wallpaper
bind = $mod CTRL, W, exec, hyprctl dispatch exec next_shuffled_wallpaper prev # Next shuffled wallpaper

# === Media Controls ===
bindel = , XF86AudioPlay, exec, dms ipc call mpris playPause # Play/pause media
bindel = , XF86AudioNext, exec, dms ipc call mpris next # Next media track
bindel = , XF86AudioPrev, exec, dms ipc call mpris previous # Previous media track
bindel = , XF86AudioStop, exec, dms ipc call mpris stop # Stop media playback
bindel = , XF86AudioRewind, exec, dms ipc call mpris position 10- # Rewind media 10 seconds
bindel = , XF86AudioForward, exec, dms ipc call mpris position 10+ # Forward media 10 seconds
bindel = $mod, F5, exec, hyprctl dispatch exec rmpc prev # Previous media track - RMPC
bindel = $mod, F6, exec, hyprctl dispatch exec rmpc next # Next media track - RMPC
bindel = $mod, F7, exec, hyprctl dispatch exec rmpc togglepause # Play/pause media - RMPC
bindel = $mod, F8, exec, hyprctl dispatch exec rmpc togglerandom # Toggle random mode - RMPC
bindel = $mod SHIFT, F9, exec, hyprctl dispatch exec rmpcDeleteCurrentSong true # Delete current song file playing in RMPC
