# ==================
# DECORATION
# ==================
decoration {
    rounding = 0 # 12
    active_opacity = 1.0
    inactive_opacity = 0.9
    shadow {
        enabled = true
        range = 30
        render_power = 5
        offset = 0 5
        color = rgba(00000070)
    }
}

group {
    groupbar {
        enabled = true
        height = 10 # Default is 14
        render_titles = false
        keep_upper_gap = false
    }
}