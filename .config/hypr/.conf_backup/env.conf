# ==================
# ENVIRONMENT VARS
# ==================
env = QT_QPA_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORMTHEME,gtk3
env = QT_QPA_PLATFORMTHEME_QT6,gtk3
env = TERMINAL,kitty
env = BROWSER,firefox
env = FILE_MANAGER,kitty -e yazi
env = EDITOR,nvim

# Custom variables
env = PATH,$HOME/.local/bin:$PATH
env = MUSIC_DIRECTORY,/mnt/hdd/Media/Music
env = WALLPAPER_DIRECTORY,$HOME/Pictures/Wallpapers

# Hyprcursor variables
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,20

# Machine GPU overlay (written by ArchX — not tracked in git)
# Uses glob so a missing dir/file does not hard-fail before first bootstrap.
source = ./env.d/*.conf
