music_directory "/mnt/hdd/Media/Music/"
playlist_directory "~/.config/mpd/playlists/"
db_file "~/.config/mpd/database"
log_file "~/.config/mpd/log"
state_file "~/.config/mpd/state"
sticker_file "~/.config/mpd/sticker.sql"
auto_update "yes"

audio_output {
    type "pulse"
    name "JDS Labs Atom DAC+ Pro - DT 1990 Pro"
    format "44100:24:2"
}

follow_outside_symlinks "yes"
follow_inside_symlinks "yes"

# this is used in rmpc
audio_output {
    type "fifo"
    name "my_fifo"
    path "/tmp/mpd.fifo"
    format "44100:16:2"
}
